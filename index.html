<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claw-Empire — AI Agent Office Simulator</title>
    <meta name="description" content="Command Your AI Agent Empire from the CEO Desk — A local-first AI agent office simulator" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0e1a" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;
      background:linear-gradient(135deg,#0a0e1a 0%,#111827 50%,#1e1b4b 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.6s ease">
      <div style="animation:splashPulse 1.5s ease-in-out infinite;text-align:center">
        <div style="font-size:72px;margin-bottom:8px;text-shadow:0 0 40px rgba(99,102,241,0.5)">🏢</div>
        <h1 style="font-size:28px;font-weight:900;background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);
          -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 4px">CLAW-EMPIRE</h1>
        <p style="color:#8892a8;font-size:12px;font-weight:500;letter-spacing:2px;margin:0">AI AGENT OFFICE SIMULATOR</p>
      </div>
      <div style="width:200px;margin-top:32px">
        <div style="width:100%;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden">
          <div id="splashBar" style="width:0%;height:100%;background:linear-gradient(90deg,#6366f1,#ec4899);border-radius:2px;transition:width 0.3s ease"></div>
        </div>
        <p id="splashText" style="color:#6b7280;font-size:10px;text-align:center;margin-top:8px">Initializing systems...</p>
      </div>
    </div>
    <style>
      @keyframes splashPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
    </style>
    <script>
      (function() {
        const msgs = ['Loading agents...', 'Setting up office...', 'Brewing coffee ☕', 'Starting AI engines...', 'Ready!'];
        const bar = document.getElementById('splashBar');
        const txt = document.getElementById('splashText');
        let p = 0;
        const iv = setInterval(() => {
          p += 20 + Math.random() * 15;
          if (p > 100) p = 100;
          bar.style.width = p + '%';
          txt.textContent = msgs[Math.min(Math.floor(p / 25), msgs.length - 1)];
          if (p >= 100) {
            clearInterval(iv);
            setTimeout(() => {
              const splash = document.getElementById('splashScreen');
              splash.style.opacity = '0';
              setTimeout(() => splash.remove(), 600);
            }, 400);
          }
        }, 400);
      })();
    </script>

    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo-icon">🏢</div>
                    <div class="logo-text">
                        <h1>Claw-Empire</h1>
                        <span class="version-badge">v2.0.4</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-user" style="cursor:pointer" onclick="showCeoProfile()" title="View CEO Profile">

                <div class="user-info">
                    <span class="user-name" id="ceoName">CEO Admin</span>
                    <span class="user-role" id="ceoRole"><span id="ceoLevelBadge" style="color:#f59e0b">⭐ Lv.1</span> · CEO</span>
                </div>
                <div class="online-indicator"></div>
                <button onclick="event.stopPropagation();handleLogout()" title="Logout" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;padding:4px;border-radius:6px;transition:all 0.2s" onmouseover="this.style.color='var(--danger)'" onmouseout="this.style.color='var(--text-muted)'">🚪</button>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">MAIN</div>
                <button class="nav-item active" data-tab="dashboard" id="nav-dashboard">

                    <span data-i18n="dashboard">Dashboard</span>
                    <span class="nav-badge" data-i18n="live">Live</span>
                </button>
                <button class="nav-item" data-tab="office" id="nav-office">

                    <span data-i18n="office">Office View</span>
                </button>
                <button class="nav-item" data-tab="kanban" id="nav-kanban">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
                    <span data-i18n="kanban">Kanban Board</span>
                    <span class="nav-badge accent">12</span>
                </button>
                <button class="nav-item" data-tab="agents" id="nav-agents">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span data-i18n="agents">Agents</span>
                    <span class="nav-badge">8</span>
                </button>

                <div class="nav-section-title">WORK</div>
                <button class="nav-item" data-tab="chat" id="nav-chat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span data-i18n="chat">Chat / Commands</span>
                    <span class="nav-badge pulse">3</span>
                </button>
                <button class="nav-item" data-tab="skills" id="nav-skills">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    <span data-i18n="skills">Skills Library</span>
                    <span class="nav-badge">600+</span>
                </button>
                <button class="nav-item" data-tab="meetings" id="nav-meetings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span data-i18n="meetings">Meetings</span>
                </button>
                <button class="nav-item" data-tab="reports" id="nav-reports">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <span data-i18n="reports">Reports</span>
                </button>

                <div class="nav-section-title">SYSTEM</div>
                <button class="nav-item" data-tab="messenger" id="nav-messenger">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    <span data-i18n="messenger">Messenger</span>
                </button>
                <button class="nav-item" data-tab="settings" id="nav-settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span data-i18n="settings">Settings</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="system-status">
                    <div class="status-dot online"></div>
                    <span data-i18n="systemOnline">System Online</span>
                </div>
                <div class="build-info">SQLite Local · WebSocket Active</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button id="sidebar-toggle" class="icon-btn" title="Toggle Sidebar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div class="breadcrumb">
                        <span class="breadcrumb-item" id="currentSection">Dashboard</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="search-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" placeholder="Search agents, tasks..." id="globalSearch" />
                        <kbd>⌘K</kbd>
                    </div>
                    <button class="icon-btn notification-btn" id="notificationBtn" title="Notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="notification-dot"></span>
                    </button>
                    <button class="icon-btn" id="themeToggle" title="Toggle Theme">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                    <div class="topbar-avatar" id="topbarAvatar">
                        <span>AD</span>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Dashboard Tab (default) -->
                <div class="tab-content active" id="tab-dashboard"></div>
                <div class="tab-content" id="tab-office"></div>
                <div class="tab-content" id="tab-kanban"></div>
                <div class="tab-content" id="tab-agents"></div>
                <div class="tab-content" id="tab-chat"></div>
                <div class="tab-content" id="tab-skills"></div>
                <div class="tab-content" id="tab-meetings"></div>
                <div class="tab-content" id="tab-reports"></div>
                <div class="tab-content" id="tab-messenger"></div>
                <div class="tab-content" id="tab-settings"></div>
            </div>
        </main>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContainer"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Global Search Results -->
    <div class="search-results" id="searchResults"></div>

    <!-- Auth Gate -->
    <script>
        const SUPABASE_URL = 'https://orpubwckffcxvyapchqj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ycHVid2NrZmZjeHZ5YXBjaHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1OTA3MDcsImV4cCI6MjA4OTE2NjcwN30.hkwWIHwLgPMr1jLl9qv8cYakSs_j4-8PSH2gMQ-hXkc';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabaseClient; // expose for other modules

        // Auth gate — redirect to login if not authenticated
        (async function() {
            try {
                var result = await supabaseClient.auth.getSession();
                var session = result.data.session;
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }
                // Update sidebar with real user info
                var user = session.user;
                var name = (user.user_metadata && user.user_metadata.full_name) || (user.email ? user.email.split('@')[0] : 'User');
                var initials = name.split(' ').map(function(w) { return w[0]; }).join('').toUpperCase().slice(0, 3);
                document.getElementById('ceoAvatar').textContent = initials;
                document.getElementById('ceoName').textContent = name;
                document.getElementById('ceoRole').textContent = user.email;
                window.currentUser = user;

                // Connect Store to Supabase cloud sync (runs after store.js loads)
                window._pendingCloudConnect = { client: supabaseClient, userId: user.id };
            } catch(e) {
                console.error('Auth gate error:', e.message);
                window.location.href = 'login.html';
            }
        })();

        async function handleLogout() {
            try { await supabaseClient.auth.signOut(); } catch(e) {}
            localStorage.removeItem('claw-empire-state');
            window.location.href = 'login.html';
        }
    </script>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/store.js"></script>
    <script src="js/components.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/office.js"></script>
    <script src="js/kanban.js"></script>
    <script src="js/agents.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/meetings.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/messenger.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/gameplay.js"></script>
    <script src="js/endgame.js"></script>
    <script src="js/extras.js"></script>
    <script src="js/app.js"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ SW registered:', reg.scope))

</body>
</html>
