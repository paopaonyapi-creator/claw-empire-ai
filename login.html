<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claw-Empire — Login</title>
    <meta name="description" content="Sign in to your AI Agent Empire" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0e1a; --card: #111827; --border: #1e2a45;
            --accent: #6366f1; --accent-light: #818cf8; --accent-glow: rgba(99,102,241,0.3);
            --text: #e8eaf0; --text-muted: #8892a8; --danger: #ef4444; --success: #22c55e;
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        /* Animated background */
        canvas#bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        .login-container {
            position: relative; z-index: 10; width: 100%; max-width: 440px; padding: 20px;
        }
        .login-card {
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 40px 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px var(--accent-glow);
        }
        .login-logo {
            display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 8px;
        }
        .login-logo-icon {
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--accent), #a855f7); border-radius: 14px;
            font-size: 28px; box-shadow: 0 0 25px var(--accent-glow);
        }
        .login-logo h1 {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, var(--accent-light), #06b6d4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-subtitle {
            text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 32px;
        }

        /* Tabs */
        .auth-tabs {
            display: flex; gap: 4px; background: rgba(30,42,69,0.5); border-radius: 12px;
            padding: 4px; margin-bottom: 28px;
        }
        .auth-tab {
            flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer;
            font-family: inherit; font-size: 14px; font-weight: 600;
            background: transparent; color: var(--text-muted); transition: all 0.25s;
        }
        .auth-tab.active {
            background: var(--accent); color: white;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .auth-tab:hover:not(.active) { color: var(--text); }

        /* Form */
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-form.hidden { display: none; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input {
            padding: 12px 14px; background: rgba(21,27,48,0.8); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text); font-family: inherit; font-size: 14px;
            transition: all 0.25s; outline: none;
        }
        .form-input:focus {
            border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .form-input::placeholder { color: var(--text-muted); opacity: 0.6; }

        .btn-auth {
            padding: 13px; border: none; border-radius: 12px; cursor: pointer;
            font-family: inherit; font-size: 15px; font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            color: white; transition: all 0.3s; margin-top: 4px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-auth:hover {
            transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow);
        }
        .btn-auth:active { transform: translateY(0); }
        .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Divider */
        .divider {
            display: flex; align-items: center; gap: 12px; margin: 4px 0;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }
        .divider span { color: var(--text-muted); font-size: 12px; }

        /* OAuth */
        .btn-oauth {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 11px; border: 1px solid var(--border); border-radius: 10px;
            background: rgba(21,27,48,0.5); color: var(--text); cursor: pointer;
            font-family: inherit; font-size: 13px; font-weight: 500; transition: all 0.25s;
        }
        .btn-oauth:hover { border-color: var(--accent); background: rgba(99,102,241,0.1); }
        .btn-oauth svg { width: 18px; height: 18px; }

        /* Messages */
        .auth-message {
            padding: 10px 14px; border-radius: 8px; font-size: 13px; text-align: center;
            display: none; animation: slideIn 0.3s;
        }
        .auth-message.error { display: block; background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .auth-message.success { display: block; background: rgba(34,197,94,0.15); color: #86efac; border: 1px solid rgba(34,197,94,0.3); }

        .login-footer {
            text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted);
        }
        .login-footer a { color: var(--accent-light); text-decoration: none; }

        /* Spinner */
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
            .login-logo h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon">🏢</div>
                <h1>Claw-Empire</h1>
            </div>
            <p class="login-subtitle">Command Your AI Agent Empire</p>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tabLogin">Sign In</button>
                <button type="button" class="auth-tab" id="tabRegister">Create Account</button>
            </div>

            <!-- Message -->
            <div id="authMessage" class="auth-message"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
                </div>
                <button type="submit" class="btn-auth" id="loginBtn">🚀 Sign In</button>

                <div class="divider"><span>or continue with</span></div>
                <button type="button" class="btn-oauth" id="googleLoginBtn">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Sign in with Google
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form hidden">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="regName" placeholder="Your name" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="regEmail" placeholder="you@example.com" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="regPassword" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password" />
                </div>
                <button type="submit" class="btn-auth" id="regBtn">✨ Create Account</button>

                <div class="divider"><span>or continue with</span></div>
                <button type="button" class="btn-oauth" id="googleRegBtn">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Sign up with Google
                </button>
            </form>

            <div class="login-footer">
                <p>Powered by <a href="https://supabase.com" target="_blank">Supabase</a> 🔒</p>
            </div>
        </div>
    </div>

    <script>
        // ===== Supabase Init =====
        const SUPABASE_URL = 'https://orpubwckffcxvyapchqj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ycHVid2NrZmZjeHZ5YXBjaHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1OTA3MDcsImV4cCI6MjA4OTE2NjcwN30.hkwWIHwLgPMr1jLl9qv8cYakSs_j4-8PSH2gMQ-hXkc';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check if already logged in (don't crash if rate limited)
        (async function() {
            try {
                const { data: { session } } = await sb.auth.getSession();
                if (session) window.location.href = 'index.html';
            } catch(e) { console.log('Session check skipped:', e.message); }
        })();

        // ===== Helpers =====
        function showMessage(text, type) {
            var el = document.getElementById('authMessage');
            el.className = 'auth-message ' + type;
            el.textContent = text;
        }
        function hideMessage() {
            document.getElementById('authMessage').className = 'auth-message';
        }
        function setLoading(btnId, loading) {
            var btn = document.getElementById(btnId);
            btn.disabled = loading;
            if (loading) {
                btn.dataset.origText = btn.textContent;
                btn.innerHTML = '<span class="spinner"></span> Please wait...';
            } else {
                btn.textContent = btn.dataset.origText || btn.textContent;
            }
        }

        // ===== DOM Ready =====
        document.addEventListener('DOMContentLoaded', function() {
            // Tab switching
            document.getElementById('tabLogin').addEventListener('click', function() {
                this.classList.add('active');
                document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                hideMessage();
            });
            document.getElementById('tabRegister').addEventListener('click', function() {
                this.classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('loginForm').classList.add('hidden');
                hideMessage();
            });

            // Login form
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessage();
                setLoading('loginBtn', true);
                var email = document.getElementById('loginEmail').value.trim();
                var password = document.getElementById('loginPassword').value;
                try {
                    var result = await sb.auth.signInWithPassword({ email: email, password: password });
                    if (result.error) { showMessage(result.error.message, 'error'); setLoading('loginBtn', false); return; }
                    showMessage('Login successful! Redirecting... 🚀', 'success');
                    setTimeout(function() { window.location.href = 'index.html'; }, 800);
                } catch (err) {
                    showMessage('Connection error: ' + err.message, 'error');
                    setLoading('loginBtn', false);
                }
            });

            // Register form
            document.getElementById('registerForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessage();
                setLoading('regBtn', true);
                var name = document.getElementById('regName').value.trim();
                var email = document.getElementById('regEmail').value.trim();
                var password = document.getElementById('regPassword').value;
                try {
                    var result = await sb.auth.signUp({
                        email: email, password: password,
                        options: { data: { full_name: name } }
                    });
                    if (result.error) { showMessage(result.error.message, 'error'); setLoading('regBtn', false); return; }
                    if (result.data.session) {
                        showMessage('✅ Account created! Redirecting...', 'success');
                        setTimeout(function() { window.location.href = 'index.html'; }, 800);
                    } else if (result.data.user) {
                        showMessage('✅ Account created! Please check your email to verify, then sign in.', 'success');
                        setTimeout(function() { document.getElementById('tabLogin').click(); }, 2000);
                    }
                    setLoading('regBtn', false);
                } catch (err) {
                    showMessage('Connection error: ' + err.message, 'error');
                    setLoading('regBtn', false);
                }
            });

            // Google OAuth
            async function googleLogin() {
                try {
                    var result = await sb.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo: window.location.origin + '/index.html' }
                    });
                    if (result.error) showMessage(result.error.message, 'error');
                } catch(e) { showMessage(e.message, 'error'); }
            }
            document.getElementById('googleLoginBtn').addEventListener('click', googleLogin);
            document.getElementById('googleRegBtn').addEventListener('click', googleLogin);
        });

        // ===== Particle Background =====
        (function() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resize();
            window.addEventListener('resize', resize);
            const particles = Array.from({ length: 60 }, function() { return {
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                r: Math.random() * 2 + 0.5,
                dx: (Math.random() - 0.5) * 0.4, dy: (Math.random() - 0.5) * 0.4,
                opacity: Math.random() * 0.4 + 0.1,
            }; });
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(function(p) {
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = '#6366f1'; ctx.globalAlpha = p.opacity; ctx.fill();
                    p.x += p.dx; p.y += p.dy;
                    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
                });
                ctx.globalAlpha = 0.04; ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 0.5;
                for (var i = 0; i < particles.length; i++) {
                    for (var j = i + 1; j < particles.length; j++) {
                        var dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
                        if (Math.sqrt(dx*dx+dy*dy) < 100) {
                            ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                        }
                    }
                }
                ctx.globalAlpha = 1;
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
