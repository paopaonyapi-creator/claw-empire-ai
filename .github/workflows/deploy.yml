name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Surge
        run: npm install -g surge

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/js
          cp index.html login.html styles.css manifest.json sw.js deploy/
          cp icon-512.png deploy/ 2>/dev/null || true
          cp js/*.js deploy/js/
          cp deploy/index.html deploy/200.html

      - name: Deploy to Surge
        run: surge deploy/ claw-empire-ai.surge.sh --token ${{ secrets.SURGE_TOKEN }}

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          cd backend
          railway up --detach --service claw-empire-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
